<!DOCTYPE html> <!--serve para identificar a linguagem de programação que está sendo utilizada.-->
<html lang="pt-br"> <!--abertura do documento, delimita o espaço de codificação. Todas as tags devem ser colocadas nesses espaço.-->
<head> <!--tag que define o cabeçalho do documento. Tudo que for escrito dentro dessa tag não aparecerá na página principal. Dentro dessa tag pode ser inserida folhas de estilos e scripts.-->
    <meta charset="UTF-8"> <!--especifica qual o conjunto de caracteres (character set ou charset), será usado para renderizar o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fornece os metados sobre a sua página-->
    <title>Portifólio</title> <!--título da página-->
</head> <!--fechamento do cabeçalho-->
<body><!--nesse espaço está contido o conteúdo visual da página. As tags que representam texto, botões e outros, devem ser adicionados nesse intervalo-->
    <!--Um documento HTML é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas,o que as diferenciam é que tags de fechamento possuem uma \ antes do nome. alguns códigos não precisam de <\> para fechamento, apenas da barra, ou nem isso, como no caso de tag meta. Outro aspecto importante é que ela é case insensitive, ou seja, não leva em consideração a diferença entre letras oficiais e minúsculas. <-->

<h1>Matemática</h1>
<h2>Historia</h2>
<h3>Geografia</h3>
<h4>Portugues</h4>
<h5><fisíca/h5>

</body>
</html><!--fechamento da tag, documento.-->
